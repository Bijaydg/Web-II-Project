<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New User</title>
    <link rel="stylesheet" href="/css/styles.css">  <!-- Link to custom styles if available -->
</head>
<body>
    <h2>Add New User</h2>

    <form th:action="@{/addUser}" th:object="${student}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" required>
        </div>

        <div>
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

    <a href="/records">View All Users</a>
</body>
</html>
